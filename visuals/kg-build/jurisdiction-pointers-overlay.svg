<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <marker id="arrow-ha" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2E7FCC"/></marker>
    <marker id="arrow-state" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#EE7138"/></marker>
    <marker id="arrow-county" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#32B893"/></marker>
    <marker id="arrow-muni" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#F4AE19"/></marker>
    <marker id="arrow-apm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#0B9719"/></marker>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.16"/></filter>
  </defs>

  <!-- Exit 13A south approach -->
  <path d="M 464 523 C 483 516, 502 506, 520 490" fill="none" stroke="#2E7FCC" stroke-width="1.8" marker-end="url(#arrow-ha)"/>
  <g filter="url(#shadow)">
    <rect x="338" y="510" width="126" height="26" rx="6" fill="#FFFFFF" stroke="#2E7FCC" stroke-width="1.4"/>
    <rect x="338" y="510" width="30" height="26" rx="6" fill="#2E7FCC"/>
    <text x="353" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">HA</text>
    <text x="376" y="527" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#202020">Highway Authority</text>
  </g>

  <!-- Northbound state-ramp portion in the enlarged inset -->
  <path d="M 610 234 C 592 220, 574 206, 552 193" fill="none" stroke="#EE7138" stroke-width="1.6" marker-end="url(#arrow-state)"/>
  <g filter="url(#shadow)">
    <rect x="592" y="230" width="66" height="23" rx="6" fill="#FFFFFF" stroke="#EE7138" stroke-width="1.3"/>
    <rect x="592" y="230" width="24" height="23" rx="6" fill="#EE7138"/>
    <text x="604" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">S</text>
    <text x="622" y="245" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#202020">State</text>
  </g>

  <!-- Shared North Avenue -->
  <path d="M 731 346 C 739 369, 748 395, 760 420" fill="none" stroke="#32B893" stroke-width="1.8" marker-end="url(#arrow-county)"/>
  <g filter="url(#shadow)">
    <rect x="687" y="320" width="91" height="26" rx="6" fill="#FFFFFF" stroke="#32B893" stroke-width="1.4"/>
    <rect x="687" y="320" width="28" height="26" rx="6" fill="#32B893"/>
    <text x="701" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">C</text>
    <text x="723" y="337" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#202020">County</text>
  </g>

  <!-- McLester and Tripoli -->
  <path d="M 929 376 C 938 372, 946 368, 954 369" fill="none" stroke="#F4AE19" stroke-width="1.8" marker-end="url(#arrow-muni)"/>
  <g filter="url(#shadow)">
    <rect x="802" y="350" width="127" height="26" rx="6" fill="#FFFFFF" stroke="#F4AE19" stroke-width="1.4"/>
    <rect x="802" y="350" width="28" height="26" rx="6" fill="#F4AE19"/>
    <text x="816" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">M</text>
    <text x="838" y="367" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#202020">Municipal</text>
  </g>

  <!-- Terminal gate -->
  <path d="M 1122 328 C 1103 315, 1085 304, 1061 293" fill="none" stroke="#0B9719" stroke-width="1.8" marker-end="url(#arrow-apm)"/>
  <g filter="url(#shadow)">
    <rect x="1088" y="326" width="111" height="26" rx="6" fill="#FFFFFF" stroke="#0B9719" stroke-width="1.4"/>
    <rect x="1088" y="326" width="36" height="26" rx="6" fill="#0B9719"/>
    <text x="1106" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">APM</text>
    <text x="1132" y="343" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#202020">Terminal</text>
  </g>
</svg>
