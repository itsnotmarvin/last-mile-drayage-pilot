  ],
  &quot;label&quot;: &quot;SUBRULE 34-290: STATE LEGISLATION — Rules and Regulations Governing Traffic on Highways in Port Authority Air and Marine Terminals&quot;,
  &quot;matching_scope_facts&quot;: [
    &quot;destination=APM_Terminals_Elizabeth_gate&quot;
  ],
  &quot;rule_id&quot;: &quot;reg_panynj_terminal_traffic&quot;,
  &quot;source_id&quot;: &quot;panynj_marine_terminal_tariff&quot;,
  &quot;source_locator&quot;: &quot;Subrule 34-290(3)-(5), PDF page 33&quot;,
  &quot;source_text&quot;: [
    &quot;All persons on any air terminal highway or marine terminal highway must at all times comply with any lawful order, signal or direction by voice or hand of any member of the Port Authority police force. When traffic is controlled by traffic lights, signs or by mechanical or electrical signals, such lights, signs and signals shall be obeyed unless a Port Authority police officer directs otherwise.&quot;,
    &quot;Unless otherwise directed, all vehicles on any air terminal highway or marine terminal highway shall at all times stay to the right of the center of the roadway, except in the case of one-way roadways; slow- moving vehicles shall remain as close as possible to the right-hand edge or curb of the roadway; and where a roadway is marked with traffic lanes, vehicles shall not cross markings.&quot;,
    &quot;No person shall operate a motor vehicle on an air terminal highway or marine terminal highway unless he is duly authorized to operate such vehicle on State and municipal highways in the State in which such air terminal highway or marine terminal highway is located, or unless he is especially authorized by the Port Authority to operate motor vehicles on such air terminal highway or marine terminal highway. No motor vehicle shall be permitted on any air terminal highway or marine terminal highway unless it is registered in accordance with the provisions of the law of the State in which such air terminal highway or marine terminal highway is located, or unless it is especially authorized by the Port Authority to be operated on such air terminal highway or marine terminal highway.&quot;
  ],
  &quot;source_text_verbatim&quot;: true
}</title><circle cx="3656.479398474196" cy="648.5888435031411" r="12" fill="#58b5dd" stroke="#58b5dd" stroke-width="3"/>

</g>

  &quot;source_text&quot;: [
    &quot;(a) Except as provided in (c) below, a single-trip permit is required for each one-way trip of an oversize or overweight vehicle that exceeds the dimension or weight provisions of N.J.S.A. 39:3-84.&quot;,
    &quot;(b) In the event the vehicle is both oversize and overweight, a single-trip permit will be issued for each one-way trip.&quot;,
    &quot;(c) An annual ocean borne containerized cargo multiple-trip permit may be issued for a tractor semitrailer combination engaged in the transportation of sealed containers of the type commonly used for the conveyance of freight transportation in international ocean going commerce as follows:&quot;,
    &quot;1. Sealed containers transported under an annual ocean borne containerized cargo multiple-trip permit shall bear the seal of the United States Custom Service, the seal of another governmental agency or the seal of a shipper;&quot;,
    &quot;2. The combined gross vehicle weight of any tractor semitrailer combination, including load or content conveying sealed containers, shall not exceed 90,000 pounds. The tractor semitrailer combination per-axle combined weight shall not exceed 38,000 pounds for any one tandem axle unit in any tractor semitrailer combination and shall not exceed 56,400 pounds for any tri-axle trailer configuration. Additionally, vehicles shall conform with the axle limitations in N.J.S.A. 39:3-84 and the maximum tire load limit in N.J.A.C. 13:18-1.10(a)2. Vehicles or combination of vehicles that exceed these weight limits may not use an annual ocean borne containerized cargo multiple-trip permit and shall obtain a single-trip permit as described in (a) above;&quot;
